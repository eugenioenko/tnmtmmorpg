name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      # Node 24: the server runs .ts directly via native type stripping, so
      # there is no build step to check — the type checker is the only thing
      # that ever looks at these types.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Boots real servers over websockets on port 3989; see packages/server/src/test-*.ts
      - run: pnpm --filter @game/server test
