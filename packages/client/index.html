<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tnmtmmorpg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(ellipse at center, #1d1914 0%, #0b0907 75%);
        overflow: hidden;
      }

      /* Centres the stage; the canvas is capped at the tiles the server
         sends, so on a large screen it letterboxes rather than stretching. */
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Sized by the canvas inside it. The overlay is positioned against
         THIS, not the window, so panels track the canvas edges instead of
         drifting into the corners of a letterboxed screen. */
      #stage {
        position: relative;
        line-height: 0;
      }

      /* Pixi owns the backing store; never scale it with CSS or the tile
         grid stops landing on whole pixels. */
      #game-canvas {
        display: block;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      }

      /* Overlay sits above the canvas; the shell never eats pointer events. */
      #ui-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
